services:
  postgres:
    image: postgres:16-alpine
    container_name: health-os-postgres
    environment:
      POSTGRES_USER: health_os
      POSTGRES_PASSWORD: health_os
      POSTGRES_DB: health_os
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: health-os-redis
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: health-os-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  minio:
    image: minio/minio:latest
    container_name: health-os-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ./backend
    container_name: health-os-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://health_os:health_os@postgres:5432/health_os
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      # Optional: enables plate-photo food recognition. Left empty, the
      # feature reports itself as unconfigured and everything else works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  ollama-data:
  minio-data:
